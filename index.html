<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Online</title>
    <style>
        * {
            box-sizing: border-box;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            background-color: #333;
            color: white;
        }

        /* Hero */
        .hero {
            position: relative;
            padding: 100px 20px;
            background-color: #f4f4f4;
            text-align: center;
        }
        .badge-promo {
            position: absolute;
            top: 10px;
            right: 15px;
            background-color: red;
            color: white;
            padding: 5px 10px;
            font-weight: bold;
        }

        /* Gallery */
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 20px;
        }
        .gallery div {
            background-color: #ddd;
            padding: 50px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <div>Logo Toko</div>
        <div>Menu</div>
    </div>

    <!-- Hero -->
    <div class="hero">
        <div class="badge-promo">Promo!</div>
        <h1>Selamat Datang</h1>
        <p>Belanja murah dan mudah.</p>
    </div>

    <!-- Gallery -->
    <div class="gallery">
        <div>Produk 1</div>
        <div>Produk 2</div>
        <div>Produk 3</div>
        <div>Produk 4</div>
        <div>Produk 5</div>
        <div>Produk 6</div>
    </div>

</body>
</html>
